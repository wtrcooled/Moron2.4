[include mainsail.cfg]
[include macros.cfg]
[include dinghy.cfg]
[include motors.cfg]
[include extruder.cfg]
[include fans.cfg]
[include bed.cfg]
[exclude_object]
[skew_correction]
[idle_timeout]
timeout: 1800
[force_move]
enable_force_move: true


#####################################################################
# Printer
#####################################################################

[printer]
kinematics: corexy
max_velocity: 700
max_accel: 63000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0


#####################################################################
# Main MCU — Octopus Max EZ
#####################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_150007001251313531383332-if00
restart_method: command


#####################################################################
# Dragon Dinghy
#####################################################################

[mcu dinghy]
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_19002D000157484837393120-if00
restart_method: command


#####################################################################
# Beacon
#####################################################################

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_1C6F0F2D4E5737374D202020FF07180C-if00
x_offset: 0
y_offset: 25.5
mesh_main_direction: x
mesh_runs: 2
contact_max_hotend_temperature: 180
home_xy_position: 175, 175
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
home_method: contact
home_method_when_homed: proximity
home_autocalibrate: unhomed


#####################################################################
# Resonance Testing
#####################################################################

[resonance_tester]
accel_chip: beacon
probe_points:
    175, 175, 20


#####################################################################
# Temperature Monitoring
#####################################################################

[temperature_sensor BTT-MCU]
sensor_type: temperature_mcu

[temperature_sensor BTT-PI]
sensor_type: temperature_host


#####################################################################
# ShakeTune
#####################################################################

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 10
show_macros_in_webui: True
timeout: 600
measurements_chunk_size: 2
max_freq: 200
dpi: 250


#####################################################################
# Input Shaper
#####################################################################

[input_shaper]
shaper_freq_x: 89.0
shaper_type_x: mzv
shaper_freq_y: 57.2
shaper_type_y: mzv
damping_ratio_x: 0.041
damping_ratio_y: 0.036


