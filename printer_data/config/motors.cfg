#####################################################################
# X — M1 — EZ5160RGB
# Primary B motor
#####################################################################

[stepper_x]
step_pin: PC13
dir_pin: !PC14
enable_pin: !PE6
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 20
homing_retract_dist: 5
homing_positive_dir: true
use_sensorless_homing: true

[tmc5160 stepper_x]
cs_pin: PG14
spi_bus: spi4
diag1_pin: ^!PF0
interpolate: true
run_current: 1.2
home_current: 1.0
sense_resistor: 0.050
stealthchop_threshold: 0


#####################################################################
# X1 — M2 — EZ5160RGB
# Secondary B motor
#####################################################################

[stepper_x1]
step_pin: PE4
dir_pin: !PE5
enable_pin: !PE3
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200

[tmc5160 stepper_x1]
cs_pin: PG13
spi_bus: spi4
interpolate: true
run_current: 1.2
home_current: 1.0
sense_resistor: 0.050
stealthchop_threshold: 0


#####################################################################
# Y — M3 — EZ5160RGB
# Primary A motor
#####################################################################

[stepper_y]
step_pin: PE1
dir_pin: !PE0
enable_pin: !PE2
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: PF4
position_min: -10
position_endstop: 350
position_max: 350
homing_speed: 100
homing_retract_dist: 10
homing_positive_dir: true

[tmc5160 stepper_y]
cs_pin: PG12
spi_bus: spi4
interpolate: true
run_current: 1.2
home_current: 1.0
sense_resistor: 0.050
stealthchop_threshold: 0


#####################################################################
# Y1 — M4 — EZ5160RGB
# Secondary A motor
#####################################################################

[stepper_y1]
step_pin: PB8
dir_pin: !PB9
enable_pin: !PB7
microsteps: 32
rotation_distance: 40
full_steps_per_rotation: 200

[tmc5160 stepper_y1]
cs_pin: PG11
spi_bus: spi4
interpolate: true
run_current: 1.2
home_current: 1.0
sense_resistor: 0.050
stealthchop_threshold: 0


#####################################################################
# Z0 — M5 — EZ2209
# Left front
#####################################################################

[stepper_z]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 340
position_min: -5
homing_speed: 50
second_homing_speed: 3
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PG10
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999


#####################################################################
# Z1 — M6 — EZ2209
# Left rear
#####################################################################

[stepper_z1]
step_pin: PG15
dir_pin: PB3
enable_pin: !PD5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PG9
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999


#####################################################################
# Z2 — M7 — EZ2209
# Right rear
#####################################################################

[stepper_z2]
step_pin: PD3
dir_pin: !PD2
enable_pin: !PD4
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PD7
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999


#####################################################################
# Z3 — M8 — EZ2209
# Right front
#####################################################################

[stepper_z3]
step_pin: PA10
dir_pin: PA9
enable_pin: !PA15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
