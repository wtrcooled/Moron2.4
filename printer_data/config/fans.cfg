#pin: dinghy:PA8
#tachometer_pin: dinghy:PC13

#[fan_generic fan1]
#pin: dinghy:PB4
#tachometer_pin: dinghy:PC14

[fan_generic fan2]
pin: dinghy:PA4
tachometer_pin: dinghy:PC15
tachometer_ppr: 2
tachometer_poll_interval: 0.001
cycle_time: 0.00004
hardware_pwm: true


[fan_generic fan3]
pin: dinghy:PB14
tachometer_pin: dinghy:PB15